<!DOCTYPE html>
<html lang="ja" data-root="..">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ご予約 | 出雲大社讃岐分院</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
  <style id="boot-loader">
html:not(.is-ready){overflow:hidden;height:100%;min-height:100dvh;background:#fff}
html:not(.is-ready) body{opacity:0;background:#fff}
html:not(.is-ready)::before{content:"";position:fixed;inset:0;width:100%;height:100%;min-height:100dvh;background:#fff;z-index:100000}
html:not(.is-ready)::after{content:"";position:fixed;top:50%;left:50%;width:120px;height:120px;transform:translate(-50%,-50%);background:url("../assets/crest.png") center/contain no-repeat;z-index:100001;animation:lp-fade 1s infinite}
@keyframes lp-fade{from{opacity:1}50%{opacity:.5}to{opacity:1}}
</style>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main>
    <div class="page-hero"><h1>ご予約フォーム</h1></div>
    <article class="content">
      <p class="lead">いまは一括の予約フォームです。地鎮祭・神前結婚式・年変年戻し・家祓い・出雲屋敷など、内容を選んでお申し込みください。本番の予約受付は、受け入れ態勢が整ってから開始します。</p>
      <p class="prefill-note" data-prefill-note hidden></p>
      <form class="form" data-fake-submit>
        <label><div><span>必須</span>お名前</div><input required name="name"></label>
        <label><div><span>必須</span>ふりがな</div><input required name="kana"></label>
        <label><div><span>必須</span>メールアドレス</div><input required type="email" name="email"></label>
        <label><div><span>必須</span>お電話番号</div><input required name="tel"></label>
        <label><div><span>必須</span>ご予約の内容</div>
          <select required name="type">
            <option value="">—以下から選択してください—</option>
            <option>地鎮祭</option>
            <option>神前結婚式</option>
            <option>年変年戻し</option>
            <option>家祓い</option>
            <option>出雲屋敷</option>
            <option>縁むすび</option>
            <option>その他</option>
          </select>
        </label>
        <label><div><span>必須</span>ご希望日</div><input required type="date" name="date"></label>
        <label>備考<textarea name="note"></textarea></label>
        <label style="grid-template-columns:auto 1fr; align-items:center;">
          <input required type="checkbox">
          <span style="color:#3a3734;">個人情報の取り扱いに同意します</span>
        </label>
        <button class="btn btn-red" type="submit">送信する</button>
      </form>
    </article>
  </main>
  <script src="../js/site.js"></script>
</body>
</html>
