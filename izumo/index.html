    <div class="page-hero"><h1>出雲大社について</h1></div>
    <article class="content">
      <p class="lead">出雲大社は、島根県出雲市に鎮座し、大国主大神（だいこくさま）をお祀りする、日本有数のおやしろです。正式には「いづもおおやしろ」と読みます。</p>
      <h2>縁むすび</h2>
      <p>だいこくさまは縁むすびの神様として古くから信仰されています。男女の縁だけでなく、人々を取り巻くあらゆるつながりのご縁です。</p>
      <h2>なぜ分院があるのか</h2>
      <p>出雲と伊勢は、全国でも別格とされることがあります。遠くの本社まで行けなくても、身近な地で同じ神様にお参りできるよう、各地に分祠・分院が開かれました。讃岐分院もそのひとつです。</p>
      <p class="center"><a class="btn" href="../about/index.html">讃岐分院について</a></p>
