<!DOCTYPE html>
<html lang="ja" data-root="..">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お守り・縁起物・おみくじ | 出雲大社讃岐分院</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main>
    <div class="page-hero"><h1>お守り・縁起物・おみくじ</h1></div>
    <article class="content">
      <p class="lead">授与品は、出雲大社本社からのものと、讃岐分院オリジナルのものに分けてご案内します。風鈴みくじは、境内で実際にご覧いただけます。</p>
      <h2>本社からの授与品</h2>
      <div class="product-grid">
        <div class="product">縁むすび守</div>
        <div class="product">開運守</div>
        <div class="product">厄除守</div>
        <div class="product">御神札</div>
      </div>
      <h2>讃岐分院オリジナル</h2>
      <div class="product-grid">
        <div class="product">うどんのお守り</div>
        <div class="product">うさぎのお守り</div>
        <div class="product has-photo" style="background-image:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.45)),url('../assets/photos/furin.jpg')">風鈴</div>
      </div>
      <h2>おみくじ</h2>
      <div class="card-grid">
        <div class="mini-card"><h3>おみくじ</h3><p>普通のおみくじ。参拝の記念に。</p></div>
        <div class="mini-card"><h3>恋みくじ</h3><p>縁むすびのご縁を占う恋みくじ。</p></div>
        <div class="mini-card"><h3>うさぎ</h3><p>因幡の白うさぎにちなんだ授与品です。</p></div>
        <div class="mini-card"><h3>風鈴みくじ</h3><p>夏の境内に似合う、風鈴のおみくじです。</p></div>
      </div>
      <div class="photo-pair">
        <figure>
          <img src="../assets/photos/furin-omikuji.jpg" alt="風鈴みくじ">
          <figcaption>風鈴みくじ</figcaption>
        </figure>
        <figure>
          <img src="../assets/photos/furin-shimenawa.jpg" alt="風鈴みくじとしめ縄">
          <figcaption>風鈴みくじとしめ縄</figcaption>
        </figure>
      </div>
    </article>
  </main>
  <script src="../js/site.js"></script>
</body>
</html>
