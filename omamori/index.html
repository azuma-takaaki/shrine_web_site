<!DOCTYPE html>
<html lang="ja" data-root="..">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>お守り・縁起物・おみくじ | 出雲大社讃岐分院</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
  <style id="boot-loader">
html:not(.is-ready){overflow:hidden;height:100%;min-height:100dvh;background:#fff}
html:not(.is-ready) body{opacity:0;background:#fff}
html:not(.is-ready)::before{content:"";position:fixed;inset:0;width:100%;height:100%;min-height:100dvh;background:#fff;z-index:100000}
html:not(.is-ready)::after{content:"";position:fixed;top:50%;left:50%;width:120px;height:120px;transform:translate(-50%,-50%);background:url("../assets/crest.png") center/contain no-repeat;z-index:100001;animation:lp-fade 1s infinite}
@keyframes lp-fade{from{opacity:1}50%{opacity:.5}to{opacity:1}}
</style>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main>
    <div class="page-hero"><h1>お守り・縁起物・おみくじ</h1></div>
    <article class="content omamori-page">
      <h2>本社からの授与品</h2>
      <div class="product-grid">
        <div class="product"><span class="product-name">縁むすび守</span></div>
        <div class="product"><span class="product-name">開運守</span></div>
        <div class="product"><span class="product-name">厄除守</span></div>
        <div class="product"><span class="product-name">御神札</span></div>
      </div>
      <h2>讃岐分院オリジナル</h2>
      <div class="product-grid">
        <div class="product"><span class="product-name">うどんのお守り</span></div>
        <div class="product"><span class="product-name">うさぎのお守り</span></div>
      </div>
      <h2>おみくじ</h2>
      <div class="product-grid">
        <div class="product">
          <span class="product-name">おみくじ</span>
          <span class="product-desc">普通のおみくじ。参拝の記念に。</span>
        </div>
        <div class="product">
          <span class="product-name">恋みくじ</span>
          <span class="product-desc">縁むすびのご縁を占う恋みくじ。</span>
        </div>
        <div class="product">
          <span class="product-name">うさぎ</span>
          <span class="product-desc">因幡の白うさぎにちなんだ授与品です。</span>
        </div>
        <div class="product has-photo" style="background-image:linear-gradient(180deg,transparent 42%,rgba(28,22,18,.72)),url('../assets/photos/furin-omikuji.jpg')">
          <span class="product-name">風鈴みくじ</span>
          <span class="product-desc">夏の境内に似合う、風鈴のおみくじです。</span>
        </div>
      </div>
    </article>
  </main>
  <script src="../js/site.js"></script>
</body>
</html>
