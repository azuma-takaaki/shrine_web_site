<!DOCTYPE html>
<html lang="ja" data-root="..">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>祈祷のご予約 | 出雲大社埼玉分院</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main>
    <div class="page-hero"><h1>祈祷のご予約</h1></div>
    <article class="content">
      <p class="lead">個人情報保護に関する基本方針に同意の上、フォームにご入力下さい。メールにて確認のご返信をさせていただいております。3日程経っても返信がない場合は、お電話にてお問い合わせ下さい。</p>
      <p>※当日及び前日のご予約は、お電話にてお問い合わせください。<br>※1月3日の午前中は団体祈祷のため、8:30〜10:30はご予約いただけません。</p>
      <form class="form" data-fake-submit>
        <label><div><span>必須</span>お名前</div><input required name="name"></label>
        <label><div><span>必須</span>ふりがな</div><input required name="kana"></label>
        <label><div><span>必須</span>メールアドレス</div><input required type="email" name="email"></label>
        <label><div><span>必須</span>お電話番号</div><input required name="tel"></label>
        <label><div><span>必須</span>祈祷の種類</div>
          <select required name="type">
            <option value="">—以下から選択してください—</option>
            <option>通常祈祷</option>
            <option>郵送祈祷</option>
            <option>社頭受け渡し</option>
          </select>
        </label>
        <label><div><span>必須</span>ご希望日</div><input required type="date" name="date"></label>
        <label><div><span>必須</span>ご希望の時間帯</div>
          <select required name="time">
            <option>9:00</option><option>10:00</option><option>11:00</option>
            <option>13:00</option><option>14:00</option><option>15:00</option><option>16:00</option>
            <option>郵送祈祷</option>
          </select>
        </label>
        <label><div><span>必須</span>ご参列予定人数</div><input required name="people" placeholder="例：2名"></label>
        <label>祈祷内容<textarea name="content" placeholder="縁むすび、厄除、七五三など"></textarea></label>
        <label>備考<textarea name="note"></textarea></label>
        <label style="grid-template-columns:auto 1fr; align-items:center;">
          <input required type="checkbox">
          <span style="color:#3a3734;">個人情報保護に関する基本方針に同意します</span>
        </label>
        <p class="form-note">docomo、au、softbankなどでドメイン指定受信を設定されている場合は、@izumotaisha-saitama.com を受信できるよう設定をお願い致します。</p>
        <button class="btn btn-red" type="submit">送信する</button>
      </form>
    </article>
  </main>
  <script src="../js/site.js"></script>
</body>
</html>
