<body>
  <main>
    <div class="page-hero"><h1>新年初祈祷</h1></div>
    <article class="content">
      <p class="lead">毎年元旦より、家内安全、縁むすび、厄除、商売繁盛、合格祈願などの「新年初祈祷」をご奉仕しております。期間は1月1日～節分です。</p>
      <h2>幸先詣</h2>
      <p>幸先詣（さいさきもうで）とは、来年の初詣を年内に行うことです。12月1日より大晦日まで、幸先詣の祈祷を受け付けております。</p>
      <table class="info-table">
        <tr><th>新年初祈祷</th><td>1月1日～節分</td></tr>
        <tr><th>幸先詣</th><td>12月1日～12月31日</td></tr>
        <tr><th>玉串料</th><td>7,000円 / 10,000円 / 15,000円</td></tr>
      </table>
      <p>お正月期間は、絵馬の代わりに開運矢を授与いたします。1月3日の午前中は団体祈祷のため、8:30〜10:30はご予約いただけません。</p>
      <p class="center"><a class="btn btn-red" href="../reservation/index.html">祈祷のご予約</a></p>
    </article>
