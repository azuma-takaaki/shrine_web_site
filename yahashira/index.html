    <div class="page-hero"><h1>八柱支部</h1></div>
    <article class="content">
      <p class="lead">出雲大社埼玉分院は、一般社団法人恩送りが行う、引き取り手のない遺骨への支援や障がい者支援など、「無縁社会ゼロ」を目指す活動に共感し、共に活動して参りました。</p>
      <p>今後、一般社団法人恩送りが、宗派を超えさらなる活動を行うにあたり、神道（神社）の働きの必要性を強く感じ、法要館八柱霊園前に出雲大社埼玉分院の支部を鎮座致しました。</p>
      <p>「無縁社会ゼロ」を目指す恩送りの活動を通じて、出雲大社埼玉分院と繋がり、さらには宗祠である出雲大社の大きなご縁を結んで参ります。</p>
