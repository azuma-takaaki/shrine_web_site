<!DOCTYPE html>
<html lang="ja" data-root="..">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>境内のご案内 | 出雲大社讃岐分院</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
  <style id="boot-loader">
html:not(.is-ready){overflow:hidden;height:100%;min-height:100dvh;background:#fff}
html:not(.is-ready) body{opacity:0;background:#fff}
html:not(.is-ready)::before{content:"";position:fixed;inset:0;width:100%;height:100%;min-height:100dvh;background:#fff;z-index:100000}
html:not(.is-ready)::after{content:"";position:fixed;top:50%;left:50%;width:120px;height:120px;transform:translate(-50%,-50%);background:url("../assets/crest.png") center/contain no-repeat;z-index:100001;animation:lp-fade 1s infinite}
@keyframes lp-fade{from{opacity:1}50%{opacity:.5}to{opacity:1}}
</style>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main>
    <div class="page-hero page-hero--gate">
      <h1>境内のご案内</h1>
    </div>

    <section class="precinct-page">
      <div class="spot-block">
        <div class="spot-copy">
          <p class="intro-kicker">境内をめぐる</p>
          <h2>御社殿</h2>
          <p>○○○○○○○○○○○○○○○○○○○○。○○○○○○○○○○○○○○○○○○○○○○○○○○○○○○。</p>
        </div>
        <div class="photo-trio">
          <figure>
            <img class="photo-focus-top" src="../assets/photos/komainu.jpg" alt="狛犬">
            <figcaption>狛犬</figcaption>
          </figure>
          <figure>
            <img class="photo-focus-top" src="../assets/photos/haiden.jpg" alt="社殿と狛犬">
            <figcaption>社殿と狛犬</figcaption>
          </figure>
          <figure>
            <img src="../assets/photos/shimenawa.jpg" alt="しめ縄">
            <figcaption>しめ縄</figcaption>
          </figure>
        </div>
      </div>

      <div class="spot-block spot-block--flip">
        <div class="spot-copy">
          <p class="intro-kicker">ご縁の象徴</p>
          <h2>だいこくさま（大国主大神）とうさぎ</h2>
          <p>境内には大国主大神とうさぎの姿があります。因幡の白うさぎの伝承につながるご縁の象徴です。</p>
        </div>
        <div class="photo-pair">
          <figure>
            <img src="../assets/photos/daikoku.jpg" alt="だいこくさま（大国主大神）とうさぎ">
            <figcaption>だいこくさま（大国主大神）とうさぎ</figcaption>
          </figure>
          <figure>
            <img src="../assets/photos/temizuya.jpg" alt="手水舎とうさぎ">
            <figcaption>手水舎とうさぎ</figcaption>
          </figure>
        </div>
      </div>

      <div class="spot-block">
        <div class="spot-copy">
          <p class="intro-kicker">この地の記憶</p>
          <h2>石碑</h2>
          <p>境内の石碑も、この地と出雲をつなぐ記憶です。写真と解説は、順次追加していきます。</p>
        </div>
      </div>

      <p class="center precinct-cta">
        <a class="btn btn-red" href="../access/index.html">交通アクセス</a>
      </p>
    </section>
  </main>
  <script src="../js/site.js"></script>
</body>
</html>
